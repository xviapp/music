plugins { id 'com.android.application' }

def releaseSigningFile = rootProject.file('.signing/release.properties')
def releaseSigningProperties = new Properties()
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
}
def releaseSigningReady = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every {
    releaseSigningProperties.getProperty(it)?.trim()
}

android {
    namespace 'app.xvi.music'
    compileSdk 36
    defaultConfig {
        applicationId 'app.xvi.music'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                def configuredStoreFile = new File(releaseSigningProperties.getProperty('storeFile'))
                storeFile configuredStoreFile.isAbsolute() ? configuredStoreFile : new File(releaseSigningFile.parentFile, configuredStoreFile.path)
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('keyAlias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

tasks.matching { it.name == 'validateSigningRelease' }.configureEach {
    doFirst {
        if (!releaseSigningReady) {
            throw new GradleException('未配置 release 签名，请先运行 npm run signing:init；已有签名密钥时请恢复 .signing 目录。')
        }
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.webkit:webkit:1.18.0'
    implementation 'androidx.media3:media3-exoplayer:1.9.0'
    implementation 'androidx.media3:media3-session:1.9.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

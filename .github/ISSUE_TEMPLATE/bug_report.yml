name: Bug report
description: 报告一个可复现的问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请不要提交账号 Cookie、二维码、签名文件或包含个人数据的日志。
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请给出最小复现步骤和实际结果。
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备和 Android 版本
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      description: 删除账号、Cookie、URL 中的凭据和个人信息后再粘贴。
